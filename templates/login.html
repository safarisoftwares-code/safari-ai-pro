<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Login - Safari AI Pro</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="login-body">
<div class="login-container">
<h1>&#x1F981; Safari AI Pro</h1>
<p>Login or create an account</p>
<div class="tab-row"><button class="tab-btn active" id="loginTab" onclick="showLogin()">Login</button><button class="tab-btn" id="signupTab" onclick="showSignup()">Sign Up</button></div>
<form id="loginForm"><label>Email</label><input type="email" id="loginEmail" placeholder="you@example.com" required><label>Password</label><input type="password" id="loginPassword" placeholder="Enter password" required><button type="submit">Login</button><a href="#" onclick="showForgot()" style="display:block;text-align:center;margin-top:10px;color:#d2691e;font-size:12px;text-decoration:none;">Forgot Password?</a></form>
<form id="signupForm" style="display:none"><label>Full Name</label><input type="text" id="signupName" placeholder="Your name" required><label>Email</label><input type="email" id="signupEmail" placeholder="you@example.com" required><label>Password</label><input type="password" id="signupPassword" placeholder="Min 4 characters" required><button type="submit">Create Account</button></form>
<form id="forgotForm" style="display:none"><label>Email</label><input type="email" id="forgotEmail" placeholder="Enter your email" required><button type="submit">Send Reset Link</button><a href="#" onclick="showLogin()" style="display:block;text-align:center;margin-top:10px;color:#d2691e;font-size:12px;text-decoration:none;">Back to Login</a></form>
<div class="msg" id="msg"></div>
<a href="/" class="back">Back to Chat</a>
</div>
<script src="/static/js/auth.js"></script>
</body>
</html>
