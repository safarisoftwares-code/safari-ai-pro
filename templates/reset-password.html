<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Reset Password - Safari AI Pro</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;background:#f5e6d3;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}
.c{background:#fff;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.15);padding:40px;width:100%;max-width:420px}
h1{color:#8b4513;font-size:22px;text-align:center;margin-bottom:5px}
p{color:#888;text-align:center;margin-bottom:20px;font-size:13px}
label{display:block;margin-bottom:6px;color:#555;font-weight:600;font-size:13px}
input{padding:12px;margin-bottom:15px;width:100%;border:2px solid #e0c8a8;border-radius:10px;font-size:14px;outline:0}
input:focus{border-color:#d2691e}
button{background:#d2691e;color:#fff;border:0;padding:14px;border-radius:10px;cursor:pointer;font-weight:bold;width:100%;font-size:15px}
.msg{margin-top:12px;text-align:center;font-size:13px;display:none}
.msg.success{color:#2e7d32;display:block}
.msg.error{color:#d32f2f;display:block}
.back{display:block;text-align:center;margin-top:15px;color:#d2691e;text-decoration:none;font-size:13px}
</style>
</head>
<body>
<div class="c">
<h1>&#x1F981; Reset Password</h1>
<p>Enter your new password below</p>
<form id="resetForm">
<label>New Password</label>
<input type="password" id="newPassword" placeholder="Min 4 characters" required>
<label>Confirm Password</label>
<input type="password" id="confirmPassword" placeholder="Repeat new password" required>
<button type="submit">Reset Password</button>
</form>
<div class="msg" id="msg"></div>
<a href="/login" class="back">Back to Login</a>
</div>
<script>
var urlParams=new URLSearchParams(window.location.search);
var token=urlParams.get('token')||'';

document.getElementById('resetForm').addEventListener('submit',async function(e){
    e.preventDefault();
    if(!token){showMsg('No reset token found in URL.','error');return;}
    var pass=document.getElementById('newPassword').value;
    var confirm=document.getElementById('confirmPassword').value;
    if(pass.length<4){showMsg('Password must be at least 4 characters.','error');return;}
    if(pass!==confirm){showMsg('Passwords do not match.','error');return;}
    
    var fd=new FormData();
    fd.append('reset_token',token);
    fd.append('new_password',pass);
    
    var r=await fetch('/api/v1/auth/reset-password',{method:'POST',body:fd});
    var d=await r.json();
    
    if(d.status==='success'){
        showMsg('Password reset! Redirecting...','success');
        setTimeout(function(){window.location.href='/login';},2000);
    }else{
        showMsg(d.message||'Reset failed.','error');
    }
});

function showMsg(text,type){
    var m=document.getElementById('msg');
    m.textContent=text;
    m.className='msg '+type;
}
</script>
</body>
</html>
