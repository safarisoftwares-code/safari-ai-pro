<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Dashboard - Safari AI Pro</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;background:#f5e6d3;min-height:100vh;padding:15px}
.c{max-width:700px;margin:0 auto;background:#fff;border-radius:20px;box-shadow:0 15px 40px rgba(0,0,0,.12);overflow:hidden}

/* HEADER CARD */
.dash-header{background:linear-gradient(135deg,#d2691e,#8b4513);color:#fff;padding:20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.dash-header .user-info h2{font-size:18px;margin-bottom:2px}
.dash-header .user-info p{font-size:11px;opacity:.9}
.plan-tag{display:inline-block;padding:5px 14px;border-radius:20px;font-size:10px;font-weight:bold;letter-spacing:1px;background:rgba(255,255,255,.2);color:#fff}

/* STATS */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:15px}
.stat-card{background:#faf5f0;border:1px solid #e0c8a8;border-radius:12px;padding:14px;text-align:center}
.stat-card .icon{font-size:22px;margin-bottom:4px}
.stat-card .num{color:#8b4513;font-size:22px;font-weight:bold}
.stat-card .label{color:#888;font-size:10px;text-transform:uppercase;letter-spacing:1px;margin-top:2px}

/* USAGE BAR */
.usage-section{padding:0 15px 15px}
.usage-header{display:flex;justify-content:space-between;font-size:11px;margin-bottom:6px;color:#555}
.usage-bar{height:14px;background:#f0e0d0;border-radius:7px;overflow:hidden}
.usage-fill{height:100%;background:linear-gradient(90deg,#ff9800,#d2691e);border-radius:7px;transition:width .6s ease}
.usage-text{text-align:center;font-size:11px;color:#888;margin-top:6px}

/* INFO SECTIONS */
.info-section{margin:0 15px 15px;background:#faf5f0;border-radius:12px;padding:12px;border:1px solid #e0c8a8}
.info-section h3{color:#8b4513;font-size:13px;margin-bottom:8px}
.info-row{display:flex;justify-content:space-between;padding:6px 0;font-size:12px;border-bottom:1px solid #f0e0d0}
.info-row:last-child{border-bottom:none}
.info-row span:first-child{color:#888}
.info-row span:last-child{color:#333;font-weight:600}

/* ACTIONS */
.actions{display:flex;gap:8px;padding:0 15px 15px;flex-wrap:wrap}
.btn{flex:1;padding:11px;border-radius:10px;text-align:center;text-decoration:none;font-weight:bold;font-size:12px;cursor:pointer;border:none;min-width:120px;transition:all .3s}
.btn-primary{background:#d2691e;color:#fff}
.btn-primary:active{transform:scale(.97)}
.btn-secondary{background:#f0e0d0;color:#8b4513}
.btn-secondary:active{transform:scale(.97)}
.btn-danger{background:#ffebee;color:#d32f2f;border:1px solid #ffcdd2}
.btn-danger:active{transform:scale(.97)}

/* DESKTOP */
@media(min-width:768px){
    body{padding:40px}
    .dash-header{padding:30px}
    .dash-header .user-info h2{font-size:24px}
    .dash-header .user-info p{font-size:13px}
    .stats-grid{grid-template-columns:repeat(4,1fr);gap:15px;padding:25px}
    .stat-card{padding:20px}
    .stat-card .num{font-size:30px}
    .stat-card .label{font-size:11px}
    .info-section{margin:0 25px 20px;padding:18px}
    .actions{padding:0 25px 25px}
    .btn{font-size:14px;padding:14px}
}
</style>
</head>
<body>
<div class="c">
<div class="dash-header">
<div class="user-info">
<h2 id="userName">Loading...</h2>
<p id="userEmail">...</p>
</div>
<span class="plan-tag" id="planTag">FREE</span>
</div>

<div class="stats-grid">
<div class="stat-card"><div class="icon">📊</div><div class="num" id="queriesToday">-</div><div class="label">Today</div></div>
<div class="stat-card"><div class="icon">🎯</div><div class="num" id="dailyLimit">-</div><div class="label">Limit</div></div>
<div class="stat-card"><div class="icon">🔥</div><div class="num" id="totalQueries">-</div><div class="label">Total</div></div>
<div class="stat-card"><div class="icon">⚡</div><div class="num" id="remaining">-</div><div class="label">Left</div></div>
</div>

<div class="usage-section">
<div class="usage-header"><span>Usage Today</span><span id="usageFraction">0 / 0</span></div>
<div class="usage-bar"><div class="usage-fill" id="usageFill" style="width:0%"></div></div>
<p class="usage-text" id="usageText">Loading...</p>
</div>

<div class="info-section">
<h3>👤 Account Information</h3>
<div id="accountInfo">Loading...</div>
</div>

<div class="info-section">
<h3>💎 Plan Details</h3>
<div id="planDetails">Loading...</div>
</div>

<div class="info-section">
<h3>My Feedback</h3>
<div id="myFeedback">Loading your feedback...</div>
</div>

<div class="actions">
<a href="/" class="btn btn-primary">← Back to Chat</a>
<button class="btn btn-secondary" onclick="logoutUser()">Logout</button>
</div>

<div class="actions">
<button class="btn btn-danger" onclick="deleteAccount()">🗑 Delete My Data</button>
</div>
</div>

<script>
function logoutUser(){
    localStorage.removeItem('safari_token');
    localStorage.removeItem('safari_name');
    window.location.href='/';
}

async function deleteAccount(){
    if(!confirm('Delete ALL your data? This cannot be undone.')) return;
    var token=localStorage.getItem('safari_token');
    if(!token){window.location.href='/login';return;}
    try{
        var fd=new FormData();
        fd.append('token',token);
        var r=await fetch('/api/v1/auth/delete',{method:'POST',body:fd});
        var d=await r.json();
        if(d.status==='success'){
            localStorage.clear();
            window.location.href='/';
        }else{
            alert(d.message||'Could not delete.');
        }
    }catch(e){alert('Error.');}
}

async function loadDashboard(){
    var token=localStorage.getItem('safari_token');
    if(!token){window.location.href='/login';return;}
    try{
        var r=await fetch('/api/v1/auth/me?token='+encodeURIComponent(token));
        var d=await r.json();
        if(d.status==='success'){
            var user=d.user;
            document.getElementById('userName').textContent=user.name;
            document.getElementById('userEmail').textContent=user.email;
            var planTag=document.getElementById('planTag');
            planTag.textContent=user.plan.toUpperCase();
            document.getElementById('queriesToday').textContent=user.queries_today;
            document.getElementById('dailyLimit').textContent=user.daily_limit;
            document.getElementById('totalQueries').textContent=user.total_queries;
            var remaining=Math.max(0,user.daily_limit-user.queries_today);
            document.getElementById('remaining').textContent=remaining;
            var pct=user.daily_limit>0?Math.min(100,(user.queries_today/user.daily_limit)*100):0;
            document.getElementById('usageFill').style.width=pct+'%';
            document.getElementById('usageFraction').textContent=user.queries_today+' / '+user.daily_limit;
            document.getElementById('usageText').textContent=Math.round(pct)+'% of daily limit used';
            document.getElementById('accountInfo').innerHTML=
                '<div class="info-row"><span>Name</span><span>'+user.name+'</span></div>'+
                '<div class="info-row"><span>Email</span><span>'+user.email+'</span></div>'+
                '<div class="info-row"><span>Status</span><span>'+(user.is_banned?'Banned':'Active')+'</span></div>';
            document.getElementById('planDetails').innerHTML=
                '<div class="info-row"><span>Plan</span><span>'+user.plan.toUpperCase()+'</span></div>'+
                '<div class="info-row"><span>Daily Limit</span><span>'+user.daily_limit+' queries</span></div>'+
                '<div class="info-row"><span>Remaining</span><span>'+remaining+'</span></div>';
        }else{window.location.href='/login';}
    }catch(e){console.error(e);}
}
async function loadMyFeedback(){
    var token = localStorage.getItem('safari_token');
    if(!token) return;
    try{
        var r = await fetch('/api/v1/feedback/my-feedback?token='+encodeURIComponent(token));
        var d = await r.json();
        if(d.status === 'success'){
            var container = document.getElementById('myFeedback');
            if(d.feedbacks.length === 0){
                container.innerHTML = '<p style="color:#999;font-size:12px">No feedback submitted yet.</p>';
            } else {
                var html = '';
                d.feedbacks.forEach(function(f){
                    var stars = '★'.repeat(f.rating);
                    html += '<div style="background:#fff;border:1px solid #e0c8a8;border-radius:10px;padding:12px;margin-bottom:10px">';
                    html += '<div style="display:flex;justify-content:space-between;margin-bottom:6px">';
                    html += '<span style="color:#d2691e;font-weight:bold">'+stars+'</span>';
                    html += '<span style="color:#888;font-size:11px">'+new Date(f.created_at).toLocaleDateString()+'</span>';
                    html += '</div>';
                    html += '<p style="font-size:12px;color:#555;margin-bottom:6px"><strong>'+f.category+':</strong> '+f.message+'</p>';
                    if(f.reply){
                        html += '<div style="background:#e8f5e9;border-left:3px solid #2e7d32;padding:10px;border-radius:0 8px 8px 0;margin-top:8px">';
                        html += '<p style="font-size:11px;color:#2e7d32;font-weight:bold">Admin Reply:</p>';
                        html += '<p style="font-size:12px;color:#333">'+f.reply+'</p>';
                        html += '</div>';
                    } else {
                        html += '<p style="font-size:11px;color:#ff9800;margin-top:6px">Awaiting admin response...</p>';
                    }
                    html += '</div>';
                });
                container.innerHTML = html;
            }
        }
    } catch(e){
        console.error('Feedback load error:', e);
    }
}

document.addEventListener('DOMContentLoaded', function(){
    loadDashboard();
    loadMyFeedback();
});
</script>
</body>
</html>
